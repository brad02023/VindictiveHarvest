[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "viha"
version = "0.1.0"
description = "Vindictive Harvest — local public-source OSINT workbench"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["osint", "public-records", "investigation"]
authors = [{ name = "VIHA" }]
dependencies = [
    "httpx>=0.27",
    "PySide6>=6.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
viha = "viha.cli:main"

[tool.setuptools.packages.find]
include = ["viha*"]

[tool.setuptools.package-data]
viha = ["data/*.json", "data/*.ico", "data/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
